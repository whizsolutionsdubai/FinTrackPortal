name: Build project and deploy to SmarterASP.NET
on: [push]

jobs:
  build_and_deploy:
    name: Build package and deploy to SmarterASP.NET
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create Production config from secrets
        shell: pwsh
        run: |
          $config = @{
            ConnectionStrings = @{
              DefaultConnection = "${{ secrets.PROD_CONNECTION_STRING }}"
            }
            JwtSettings = @{
              Key = "${{ secrets.JWT_KEY }}"
              Issuer = "FinShare"
              Audience = "FinShareUsers"
              ExpiryMinutes = 60
            }
          }
          $config | ConvertTo-Json -Depth 3 | Out-File -FilePath ./FinTrackPortal.API/appsettings.Production.json -Encoding utf8

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish API project only
        run: dotnet publish ./FinTrackPortal.API/FinTrackPortal.API.csproj --configuration Release --output ./publish
        env:
          ASPNETCORE_ENVIRONMENT: Production

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ./
